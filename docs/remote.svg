<rect x="426" y="98" width="28" height="26" rx="6" fill="#34d6b4" fill-opacity="0" stroke="#34d6b4" stroke-opacity=".35"/>
<text class="m" x="440" y="116" font-size="14" text-anchor="middle" fill="#5d6877">d</text>
<rect x="16" y="152" width="448" height="196" rx="8" fill="#0a0e14"/>
<text class="m mu a r1" x="32" y="182" font-size="15">3f2a1c9 already there, 3 changed files</text>
<text class="m tx a r2" x="32" y="210" font-size="15">copy a  BULKHEAD_PORT=7172</text>
<g class="a r3">
<text class="m mu" x="32" y="246" font-size="16">$</text>
<text class="m tx" x="50" y="246" font-size="16">npm test</text>
<rect x="32" y="262" width="416" height="6" rx="3" fill="#1c2531"/>
