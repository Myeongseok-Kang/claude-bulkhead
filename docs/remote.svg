</g>
<text class="m ac a r4" x="32" y="300" font-size="16">412 passed, 0 failed</text>
<text class="m dm a r5" x="32" y="334" font-size="15">port 7172 freed, copy a released</text>
<text class="s mu lab" x="22" y="383">RAM</text>
<rect x="72" y="373" width="280" height="8" rx="4" fill="#1c2531"/>
<rect x="72" y="373" width="53" height="8" rx="4" fill="#c4ccd6"/>
<rect class="a jr" x="121" y="373" width="35" height="8" rx="4" fill="#34d6b4"/>
<text class="m mu a f0" x="458" y="383" font-size="16" text-anchor="end">26 GB free</text>
<text class="m tx a f1" x="458" y="383" font-size="16" text-anchor="end">22 GB free</text>
